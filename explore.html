<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Explore book access · Read to Grow</title>
  <meta name="description" content="Every place across Connecticut where children and families can find books, on one map.">
  <meta name="author" content="Read to Grow">
  <meta name="theme-color" content="#1E3A6F">
  <link rel="canonical" href="https://baii-input-storymap.vercel.app/explore.html">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="favicon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <style>
    /* Same tokens as index.html and methodology.html */
    :root {
      --navy:    #1E3A6F;
      --yellow:  #E8B43C;
      --terra:   #C45A4A;
      --white:   #FFFFFF;
      --white-2: rgba(255,255,255,0.7);
      --nav-h: 48px;
      --line: rgba(255,255,255,0.08);
      --line-2: rgba(255,255,255,0.18);
      --map-bg: #E8EAED;
      --rail-w: 300px;
      --panel-w: 340px;
      --sheet-tabs-h: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* The Explore view never scrolls as a page. */
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    button { font-family: inherit; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* ── Root grid ───────────────────────────────────────── */
    .ex-root {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: var(--nav-h) minmax(0, 1fr);
    }

    /* ── Slim header (site-nav look) ─────────────────────── */
    .site-nav {
      background: var(--navy);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: stretch;
      min-height: var(--nav-h);
      min-width: 0;
    }
    .site-nav .nav-logo {
      display: flex; align-items: center;
      padding: 0.4rem 0.95rem;
      flex-shrink: 0;
      border-right: 1px solid var(--line);
      text-decoration: none;
    }
    .site-nav .nav-logo img { height: 30px; width: auto; display: block; }
    .ex-title {
      display: flex; align-items: center;
      padding: 0 1.15rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ex-nav-actions { display: flex; align-items: stretch; flex-shrink: 0; }
    .ex-nav-actions a, .ex-nav-actions button {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--white);
      font-weight: 700;
      padding: 0 1.15rem;
      text-decoration: none;
      background: none;
      border: 0;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      opacity: 0.92;
      cursor: pointer;
      display: flex; align-items: center;
      transition: opacity 0.15s, border-color 0.15s;
    }
    .ex-nav-actions a:hover, .ex-nav-actions button:hover { opacity: 1; border-bottom-color: var(--white); }
    .ex-nav-actions a:focus-visible, .ex-nav-actions button:focus-visible { outline: 2px solid var(--yellow); outline-offset: -2px; }
    .ex-short { display: none; }

    /* ── Three regions ───────────────────────────────────── */
    .ex-body {
      display: grid;
      grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--panel-w);
      min-height: 0;
      overflow: hidden;
    }
    .ex-rail, .ex-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: var(--navy);
    }
    .ex-rail { border-right: 1px solid var(--line); }
    .ex-filters {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    .ex-panel { border-left: 1px solid var(--line); }
    .ex-map {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: var(--map-bg);
      overflow: hidden;
    }
    .ex-map-canvas { position: absolute; inset: 0; }
    .ex-map-msg {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      max-width: 22rem;
      background: var(--navy);
      color: var(--white);
      border: 1px solid var(--line-2);
      border-radius: 6px;
      padding: 0.8rem 1rem;
      font-size: 0.88rem;
      text-align: center;
    }
    .ex-map-msg[hidden] { display: none; }

    /* Point card (MapLibre popup) */
    .ex-card .maplibregl-popup-content {
      background: var(--navy);
      color: var(--white);
      border: 1px solid var(--line-2);
      border-radius: 6px;
      padding: 0.75rem 2rem 0.75rem 0.9rem;
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .ex-card.maplibregl-popup-anchor-top .maplibregl-popup-tip,
    .ex-card.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
    .ex-card.maplibregl-popup-anchor-top-right .maplibregl-popup-tip { border-bottom-color: var(--navy); }
    .ex-card.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
    .ex-card.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
    .ex-card.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color: var(--navy); }
    .ex-card.maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--navy); }
    .ex-card.maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--navy); }
    .ex-card .maplibregl-popup-close-button {
      color: var(--white-2);
      font-size: 1.2rem;
      width: 1.8rem; height: 1.8rem;
      top: 0.15rem; right: 0.15rem;
    }
    .ex-card .maplibregl-popup-close-button:hover { background: rgba(255,255,255,0.08); color: var(--white); }
    .ex-card-type {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: 0.2rem;
    }
    .ex-card-name { font-size: 0.98rem; font-weight: 600; line-height: 1.25; }
    .ex-card-addr { color: var(--white-2); margin-top: 0.15rem; }
    .ex-card-details {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.15rem 0.7rem;
      margin-top: 0.55rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--line);
    }
    .ex-card-details[hidden] { display: none; }
    .ex-card-details dt { color: var(--white-2); }
    .ex-card-details dd { font-weight: 600; overflow-wrap: anywhere; }
    .ex-card-note { color: var(--white-2); margin-top: 0.5rem; font-size: 0.78rem; }

    /* ── Rail blocks ─────────────────────────────────────── */
    .ex-block {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .ex-label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white-2);
      margin-bottom: 0.45rem;
    }
    .ex-input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--line-2);
      border-radius: 4px;
      color: var(--white);
      font-family: inherit;
      font-size: 0.92rem;
      padding: 0.5rem 0.65rem;
      outline: none;
    }
    .ex-input:focus { border-color: rgba(255,255,255,0.45); }
    .ex-input::placeholder { color: rgba(255,255,255,0.4); }

    /* Segmented control: same look as .yn-scope-toggle in index.html */
    .ex-toggle {
      display: flex;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line-2);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.6rem;
    }
    .ex-toggle button {
      flex: 1;
      background: transparent;
      color: rgba(255,255,255,0.65);
      border: 0;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.38rem 0.5rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .ex-toggle button + button { border-left: 1px solid rgba(255,255,255,0.12); }
    .ex-toggle button.on { background: var(--yellow); color: var(--navy); }
    .ex-toggle button:not(.on):hover { background: rgba(255,255,255,0.08); color: var(--white); }
    .ex-toggle button:focus-visible { outline: 2px solid var(--yellow); outline-offset: -2px; }
    .ex-caption {
      font-size: 0.74rem;
      color: rgba(255,255,255,0.55);
      margin-top: 0.4rem;
    }

    /* Layer list: one of the two regions allowed to scroll */
    .ex-layers {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .ex-layers .ex-label { flex-shrink: 0; }
    .ex-layer-list {
      list-style: none;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .ex-cat { border-top: 1px solid var(--line); padding: 0.3rem 0 0.35rem; }
    .ex-cat:first-child { border-top: 0; padding-top: 0; }
    .ex-cat-head, .ex-sub {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.2rem 0.15rem 0.2rem 0;
      border-radius: 3px;
    }
    .ex-cat-head { font-size: 0.82rem; font-weight: 600; }
    .ex-sub { font-size: 0.8rem; color: var(--white-2); padding-left: 1.4rem; }
    .ex-cat-head:hover, .ex-sub:hover { background: rgba(255,255,255,0.05); }
    .ex-cat-head input, .ex-sub input { accent-color: var(--yellow); width: 0.9rem; height: 0.9rem; flex-shrink: 0; margin: 0; }
    .ex-subs { list-style: none; }
    /* Each swatch sits on a chip of the map's background color so it
       reads exactly like its marker (childcare navy would vanish on the rail). */
    .ex-sw {
      width: 1rem; height: 1rem;
      border-radius: 3px;
      background: var(--map-bg);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .ex-sw::after {
      content: "";
      width: 0.55rem; height: 0.55rem;
      border-radius: 50%;
      background: var(--c);
      border: 1px solid #FFFFFF;
    }
    .ex-sw.hollow::after { background: #FFFFFF; border: 2px solid var(--c); }
    .ex-sub-name { flex: 1; min-width: 0; line-height: 1.3; }
    .ex-sub input:not(:checked) ~ .ex-sub-name { opacity: 0.5; }
    .ex-count {
      font-variant-numeric: tabular-nums;
      font-size: 0.74rem;
      color: rgba(255,255,255,0.6);
      margin-left: auto;
      padding-left: 0.3rem;
    }

    .ex-rail-foot {
      padding: 0.7rem 1rem;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    .ex-btn-ghost {
      background: transparent;
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
    }
    .ex-btn-ghost:hover { background: rgba(255,255,255,0.08); }
    .ex-btn-ghost:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

    /* ── Right panel ─────────────────────────────────────── */
    .ex-scope {
      padding: 0.85rem 1rem 0.6rem;
      flex-shrink: 0;
    }
    .ex-scope-title { font-size: 1.15rem; font-weight: 600; line-height: 1.25; }
    .ex-kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      padding: 0 1rem 0.85rem;
      flex-shrink: 0;
    }
    .ex-kpi {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line-2);
      border-radius: 6px;
      padding: 0.5rem 0.7rem;
      min-width: 0;
    }
    .ex-kpi.wide { grid-column: 1 / -1; }
    .ex-kpi.alert { border-left: 4px solid var(--terra); }
    .ex-kpi.alert .ex-kpi-num { color: #F0A193; }
    .ex-kpi-num {
      font-size: 1.45rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    .ex-kpi-num.msg { font-size: 0.85rem; font-weight: 600; line-height: 1.35; padding: 0.15rem 0; }
    .ex-kpi-num.off { font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.5); padding: 0.15rem 0; }
    .ex-kpi-label { font-size: 0.78rem; color: var(--white-2); line-height: 1.3; }
    .ex-kpi-sub {
      font-size: 0.74rem;
      color: rgba(255,255,255,0.6);
      margin-top: 0.2rem;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }
    .ex-kpi-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .ex-kpi-split {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.1rem 0.7rem;
      margin-top: 0.25rem;
      font-size: 0.74rem;
      color: rgba(255,255,255,0.6);
      font-variant-numeric: tabular-nums;
    }
    .ex-kpi-split b { color: var(--white); font-weight: 600; }

    /* Area combobox */
    .ex-combo { position: relative; }
    .ex-combo .ex-input { padding-right: 2rem; }
    .ex-combo .ex-input::-webkit-search-cancel-button { display: none; }
    .ex-combo-clear {
      position: absolute;
      right: 0.25rem; top: 50%;
      transform: translateY(-50%);
      width: 1.6rem; height: 1.6rem;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--white-2);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }
    .ex-combo-clear:hover { background: rgba(255,255,255,0.1); color: var(--white); }
    .ex-combo-clear:focus-visible { outline: 2px solid var(--yellow); outline-offset: 0; }
    .ex-combo-clear[hidden] { display: none; }
    .ex-combo-list {
      position: absolute;
      left: 0; right: 0;
      top: calc(100% + 4px);
      z-index: 20;
      max-height: min(18rem, 50vh);
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--navy);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      padding: 0.25rem 0;
    }
    .ex-combo-list[hidden] { display: none; }
    .ex-combo-head {
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--yellow);
      padding: 0.45rem 0.7rem 0.2rem;
    }
    .ex-combo-opt {
      font-size: 0.84rem;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
    }
    .ex-combo-opt:hover, .ex-combo-opt.active { background: rgba(255,255,255,0.1); }
    .ex-combo-opt[aria-selected="true"] { font-weight: 600; }
    .ex-combo-empty { font-size: 0.82rem; color: var(--white-2); padding: 0.4rem 0.7rem; }

    /* Address search (same messages and flow as Your Neighborhood) */
    .ex-addr-opt { padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.84rem; }
    .ex-addr-opt:hover, .ex-addr-opt.active { background: rgba(255,255,255,0.1); }
    .ex-addr-opt .sub { color: rgba(255,255,255,0.55); font-size: 0.74rem; margin-top: 1px; }
    .ex-addr-status { font-size: 0.78rem; color: var(--white-2); margin-top: 0.35rem; min-height: 0; }
    .ex-addr-status:empty { display: none; }
    .ex-addr-status.is-error { color: var(--yellow); }

    /* Radius mode: tighter cards so the nearby list has room */
    .ex-panel.radius .ex-scope { padding-top: 0.6rem; padding-bottom: 0.45rem; }
    .ex-panel.radius .ex-scope .ex-label { display: none; }
    .ex-panel.radius .ex-scope-title { font-size: 0.98rem; }
    .ex-panel.radius .ex-kpis { gap: 0.3rem; padding-bottom: 0.5rem; }
    .ex-panel.radius .ex-kpi { padding: 0.3rem 0.55rem; }
    .ex-panel.radius .ex-kpi,
    .ex-panel.radius .ex-kpi-pair > div {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 0.4rem;
    }
    .ex-panel.radius .ex-kpi-pair { display: grid; }
    .ex-panel.radius .ex-kpi-num { font-size: 1.05rem; }
    .ex-panel.radius .ex-kpi-num.msg, .ex-panel.radius .ex-kpi-num.off { font-size: 0.78rem; }
    .ex-panel.radius .ex-kpi-label { font-size: 0.72rem; flex: 1 1 0; min-width: 0; }
    .ex-panel.radius .ex-kpi-sub,
    .ex-panel.radius .ex-kpi-split { flex-basis: 100%; font-size: 0.7rem; margin-top: 0.05rem; }

    /* Nearby list: the other region allowed to scroll */
    .ex-nearby {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line);
    }
    .ex-nearby[hidden] { display: none; }
    .ex-nearby .ex-label { padding: 0.75rem 1rem 0; flex-shrink: 0; }
    .ex-nearby-list {
      list-style: none;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0.3rem 0.6rem 0.5rem;
    }
    .ex-near-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0 0.6rem;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 4px;
      color: var(--white);
      font-family: inherit;
      padding: 0.35rem 0.4rem;
      cursor: pointer;
    }
    .ex-near-row:hover { background: rgba(255,255,255,0.07); }
    .ex-near-row:focus-visible { outline: 2px solid var(--yellow); outline-offset: -2px; }
    .ex-near-name { font-size: 0.82rem; font-weight: 600; line-height: 1.3; }
    .ex-near-type { font-size: 0.72rem; color: var(--white-2); grid-column: 1; line-height: 1.3; }
    .ex-near-dist {
      grid-column: 2; grid-row: 1 / span 2;
      align-self: center;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      color: var(--white-2);
    }
    .ex-near-more, .ex-nearby-empty { font-size: 0.78rem; color: var(--white-2); padding: 0.4rem 0.4rem; }
    .ex-nearby-empty[hidden] { display: none; }
    .ex-panel-foot {
      margin-top: auto;
      padding: 0.6rem 1rem;
      border-top: 1px solid var(--line);
      font-size: 0.72rem;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
      min-height: 2.2rem;
    }

    /* ── "What am I looking at?" modal ───────────────────── */
    .ex-modal {
      margin: auto;
      max-width: min(520px, calc(100vw - 2rem));
      max-height: calc(100dvh - 2rem);
      background: var(--navy);
      color: var(--white);
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 1.4rem 1.5rem 1.2rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }
    .ex-modal::backdrop { background: rgba(10,20,40,0.6); }
    .ex-modal h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.7rem; }
    .ex-modal-body { color: var(--white-2); font-size: 0.95rem; line-height: 1.55; }
    .ex-modal-actions { margin-top: 1.1rem; text-align: right; }

    /* ── Mobile: full-screen map, top search, bottom sheet ──
       Layout is pure CSS: the rail dissolves (display: contents) so the
       search floats over the map and the filters join the sheet. JS only
       sets data-sheet and data-tab on .ex-body. */
    .ex-sheet-tabs { display: none; }

    @media (max-width: 767px) {
      .ex-title { padding: 0 0.75rem; }
      .ex-nav-actions a, .ex-nav-actions button { padding: 0 0.7rem; font-size: 0.64rem; letter-spacing: 0.06em; }
      .ex-long { display: none; }
      .ex-short { display: inline; }
      .ex-help {
        display: inline-flex; align-items: center; justify-content: center;
        width: 1.5rem; height: 1.5rem;
        border: 1.5px solid currentColor; border-radius: 50%;
        font-size: 0.8rem; letter-spacing: 0;
      }
      .site-nav .nav-logo { padding: 0.4rem 0.6rem; }
      .site-nav .nav-logo img { height: 26px; }

      .ex-body {
        display: block;
        position: relative;
        --sheet-h: var(--sheet-tabs-h);
      }
      .ex-body[data-sheet="open"] { --sheet-h: min(60dvh, calc(100dvh - var(--nav-h) - 4.5rem)); }
      /* The numbers need more room than the filters or the list. */
      .ex-body[data-sheet="open"][data-tab="numbers"] { --sheet-h: calc(100dvh - var(--nav-h) - 4.5rem); }
      .ex-body[data-tab="numbers"] .ex-kpis {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto; /* only on phones too short to fit every card */
        overscroll-behavior: contain;
      }
      .ex-map { position: absolute; inset: 0; }
      .ex-map .maplibregl-ctrl-top-right { display: none; }
      .ex-map .maplibregl-ctrl-bottom-right,
      .ex-map .maplibregl-ctrl-bottom-left { bottom: var(--sheet-tabs-h); }
      .ex-rail { display: contents; }

      .ex-search {
        position: absolute;
        top: 0.6rem; left: 0.6rem; right: 0.6rem;
        z-index: 5;
        background: var(--navy);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        padding: 0.55rem 0.65rem;
      }
      .ex-search .ex-label {
        position: absolute; width: 1px; height: 1px; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap;
      }

      .ex-sheet-tabs {
        display: flex;
        position: absolute;
        left: 0; right: 0;
        bottom: calc(var(--sheet-h) - var(--sheet-tabs-h));
        height: var(--sheet-tabs-h);
        z-index: 7;
        background: var(--navy);
        border-top: 1px solid var(--line-2);
        border-bottom: 1px solid var(--line);
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        transition: bottom 0.2s ease;
      }
      .ex-sheet-tabs button {
        flex: 1;
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        color: rgba(255,255,255,0.7);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .ex-body[data-sheet="open"] .ex-sheet-tabs button[aria-selected="true"] { color: var(--white); border-bottom-color: var(--yellow); }
      .ex-sheet-tabs button:focus-visible { outline: 2px solid var(--yellow); outline-offset: -2px; }

      .ex-filters, .ex-panel {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: calc(var(--sheet-h) - var(--sheet-tabs-h));
        z-index: 6;
        background: var(--navy);
        border: 0;
        transition: height 0.2s ease;
      }
      .ex-body:not([data-sheet="open"]) .ex-filters,
      .ex-body:not([data-sheet="open"]) .ex-panel { visibility: hidden; }
      .ex-body[data-tab="filters"] .ex-panel,
      .ex-body[data-tab="numbers"] .ex-filters,
      .ex-body[data-tab="nearby"] .ex-filters,
      .ex-body[data-tab="numbers"] .ex-nearby,
      .ex-body[data-tab="nearby"] .ex-scope,
      .ex-body[data-tab="nearby"] .ex-kpis,
      .ex-body[data-tab="nearby"] .ex-panel-foot { display: none; }
      .ex-body[data-tab="nearby"] .ex-nearby { display: flex; border-top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ex-sheet-tabs, .ex-filters, .ex-panel { transition: none; }
    }
  </style>
</head>

<div class="ex-root">

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(function () {
  // ── Modal ─────────────────────────────────────────────
  const about = document.getElementById("ex-about");
  document.getElementById("ex-about-open").addEventListener("click", () => about.showModal());
  document.getElementById("ex-about-close").addEventListener("click", () => about.close());
  about.addEventListener("click", e => { if (e.target === about) about.close(); });

  // ── Mobile bottom sheet ───────────────────────────────
  const body = document.getElementById("ex-body");
  const tabs = Array.from(body.querySelectorAll(".ex-sheet-tabs [role=tab]"));
  const mobile = window.matchMedia("(max-width: 767px)");

  function setSheet(open, tab) {
    if (tab) {
      body.dataset.tab = tab;
      tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
    }
    body.dataset.sheet = open ? "open" : "closed";
  }
  tabs.forEach(t => t.addEventListener("click", () => {
    const isActive = body.dataset.tab === t.dataset.tab && body.dataset.sheet === "open";
    setSheet(!isActive, t.dataset.tab);
  }));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && mobile.matches && body.dataset.sheet === "open" && !about.open) setSheet(false);
  });

  window.__exploreSheet = setSheet;
})();
</script>
<script>
// ── Map, layers legend and point cards ────────────────────
(function () {
  const DATA = "baii_data/explore/";
  const CT_BOUNDS = [[-73.7277, 40.9509], [-71.7869, 42.0506]];
  // Category colors from the storymap's Access Points section (CAT_COLOR).
  const CAT_COLOR = {
    "In-School": "#467c9d",
    "Out-of-School": "#E8B43C",
    "Childcare": "#1c3557",
    "Nonprofit": "#C45A4A",
  };
  const ALERT = "#C45A4A";
  const UNSTAFFED = "School Without Library Staff";
  const ESRI = "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/";

  const msgEl = document.getElementById("ex-map-msg");
  const listEl = document.getElementById("ex-layer-list");
  function showMessage(text) {
    msgEl.textContent = text;
    msgEl.hidden = !text;
  }

  async function getJson(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${url} ${r.status}`);
    return r.json();
  }

  const map = new maplibregl.Map({
    container: "ex-map-canvas",
    bounds: CT_BOUNDS,
    fitBoundsOptions: { padding: 24 },
    maxZoom: 16,
    minZoom: 6,
    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false,
    attributionControl: { compact: true },
    style: {
      version: 8,
      sources: {
        "esri-base": {
          type: "raster",
          tiles: [ESRI + "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}"],
          tileSize: 256,
          maxzoom: 16,
          attribution: "Basemap: Esri, HERE, Garmin, &copy; OpenStreetMap contributors, and the GIS user community",
        },
        "esri-labels": {
          type: "raster",
          tiles: [ESRI + "World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}"],
          tileSize: 256,
          maxzoom: 16,
        },
      },
      layers: [
        { id: "background", type: "background", paint: { "background-color": "#E8EAED" } },
        { id: "esri-base", type: "raster", source: "esri-base" },
        { id: "esri-labels", type: "raster", source: "esri-labels" },
      ],
    },
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

  const state = {
    meta: null,
    points: null,          // GeoJSON FeatureCollection
    areas: null,           // areas.json entries
    hidden: new Set(),     // hidden sub_type keys
    scope: { kind: "statewide" },
    inScope: () => true,
  };
  window.__explore = { map, state };

  // ── Legend ───────────────────────────────────────────
  function countsInScope() {
    const c = {};
    for (const f of state.points.features) {
      if (state.inScope(f)) c[f.properties.sub_type] = (c[f.properties.sub_type] || 0) + 1;
    }
    return c;
  }
  const fmt = n => n.toLocaleString("en-US");

  function buildLegend() {
    const { categories, sub_types } = state.meta;
    listEl.innerHTML = "";
    for (const cat of categories) {
      const li = document.createElement("li");
      li.className = "ex-cat";
      li.innerHTML = `
        <label class="ex-cat-head">
          <input type="checkbox" data-cat="${cat.key}" checked>
          <span class="ex-sub-name"></span>
          <span class="ex-count" data-cat-count="${cat.key}"></span>
        </label>
        <ul class="ex-subs"></ul>`;
      li.querySelector(".ex-sub-name").textContent = cat.label;
      const ul = li.querySelector(".ex-subs");
      for (const st of sub_types.filter(s => s.category === cat.key)) {
        const unstaffed = st.key === UNSTAFFED;
        const row = document.createElement("li");
        row.innerHTML = `
          <label class="ex-sub">
            <input type="checkbox" data-sub="${st.key}" checked>
            <span class="ex-sw${unstaffed ? " hollow" : ""}" style="--c:${unstaffed ? ALERT : CAT_COLOR[cat.key]}" aria-hidden="true"></span>
            <span class="ex-sub-name"></span>
            <span class="ex-count" data-sub-count="${st.key}"></span>
          </label>`;
        row.querySelector(".ex-sub-name").textContent = st.label;
        ul.appendChild(row);
      }
      listEl.appendChild(li);
    }
    listEl.addEventListener("change", e => {
      const t = e.target;
      const keys = t.dataset.sub ? [t.dataset.sub]
        : sub_types.filter(s => s.category === t.dataset.cat).map(s => s.key);
      for (const k of keys) {
        if (t.checked) state.hidden.delete(k); else state.hidden.add(k);
      }
      applyVisibility();
    });
  }

  function updateLegend() {
    const counts = countsInScope();
    for (const st of state.meta.sub_types) {
      listEl.querySelector(`[data-sub-count="${st.key}"]`).textContent = fmt(counts[st.key] || 0);
      listEl.querySelector(`[data-sub="${st.key}"]`).checked = !state.hidden.has(st.key);
    }
    for (const cat of state.meta.categories) {
      const subs = state.meta.sub_types.filter(s => s.category === cat.key);
      const shown = subs.filter(s => !state.hidden.has(s.key));
      const box = listEl.querySelector(`[data-cat="${cat.key}"]`);
      box.checked = shown.length === subs.length;
      box.indeterminate = shown.length > 0 && shown.length < subs.length;
      listEl.querySelector(`[data-cat-count="${cat.key}"]`).textContent =
        fmt(subs.reduce((n, s) => n + (counts[s.key] || 0), 0));
    }
  }

  // ── Point layers ─────────────────────────────────────
  function hiddenFilter(base) {
    return ["all", base, ["!", ["in", ["get", "sub_type"], ["literal", Array.from(state.hidden)]]]];
  }
  function applyVisibility() {
    map.setFilter("ex-points", hiddenFilter(["!=", ["get", "sub_type"], UNSTAFFED]));
    map.setFilter("ex-points-unstaffed", hiddenFilter(["==", ["get", "sub_type"], UNSTAFFED]));
    updateLegend();
    renderKpis();
    closeCardIfHidden();
  }

  function addPointLayers(ctOutline) {
    map.addSource("ex-ct", { type: "geojson", data: ctOutline });
    map.addSource("ex-area", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addSource("ex-radius", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addSource("ex-points", { type: "geojson", data: state.points });

    map.addLayer({
      id: "ex-ct-outline", type: "line", source: "ex-ct",
      paint: { "line-color": "#1E3A6F", "line-width": 1, "line-opacity": 0.6 },
    });
    // Selected planning region or school district (wired in Prompt 4).
    map.addLayer({
      id: "ex-area-outline", type: "line", source: "ex-area",
      paint: { "line-color": "#1E3A6F", "line-width": 2.5 },
    });

    map.addLayer({
      id: "ex-radius-fill", type: "fill", source: "ex-radius",
      paint: { "fill-color": "#1E3A6F", "fill-opacity": 0.06 },
    });
    map.addLayer({
      id: "ex-radius-line", type: "line", source: "ex-radius",
      paint: { "line-color": "#1E3A6F", "line-width": 2, "line-dasharray": [2, 1.5] },
    });

    const catColor = ["match", ["get", "sub_type"]];
    for (const st of state.meta.sub_types) catColor.push(st.key, CAT_COLOR[st.category]);
    catColor.push("#888888");
    const radius = ["interpolate", ["linear"], ["zoom"], 7, 2.5, 10, 4, 13, 6, 16, 8];

    map.addLayer({
      id: "ex-points", type: "circle", source: "ex-points",
      paint: {
        "circle-color": catColor,
        "circle-radius": radius,
        "circle-stroke-color": "rgba(255,255,255,0.9)",
        "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 7, 0.4, 12, 1],
      },
    });
    // Schools without library staff sit on top as hollow rings in the
    // alert color, so the gap reads at a glance.
    map.addLayer({
      id: "ex-points-unstaffed", type: "circle", source: "ex-points",
      paint: {
        "circle-color": "#FFFFFF",
        "circle-radius": radius,
        "circle-stroke-color": ALERT,
        "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 7, 1.2, 12, 2],
      },
    });
    applyVisibility();

    for (const id of ["ex-points", "ex-points-unstaffed"]) {
      map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; });
    }
    map.on("click", e => {
      const hits = map.queryRenderedFeatures(e.point, { layers: ["ex-points-unstaffed", "ex-points"] });
      if (hits.length) openCard(hits[0].properties.id);
      else popup.remove();
    });
  }

  // ── Point card ───────────────────────────────────────
  let detailsPromise = null;
  function loadDetails() {
    if (!state.meta.details_split) return Promise.resolve(null);
    return detailsPromise || (detailsPromise = getJson(DATA + "access_point_details.json")
      .catch(err => { detailsPromise = null; throw err; }));
  }

  // Map clicks are handled above: a point opens its card, anywhere else closes it.
  const popup = new maplibregl.Popup({ className: "ex-card", maxWidth: "300px", focusAfterOpen: false, closeOnClick: false });
  let cardId = null;
  popup.on("close", () => { cardId = null; });

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fillDetails(dl, details) {
    dl.replaceChildren();
    for (const d of details || []) dl.append(el("dt", null, d.label), el("dd", null, d.value));
    dl.hidden = !dl.childElementCount;
  }

  // Cards read from the original GeoJSON (not the rendered tile features)
  // so nested detail arrays and ids come back exactly as built.
  function openCard(id) {
    const f = state.points.features.find(x => x.properties.id === id);
    if (!f) return;
    const p = f.properties;
    const st = state.meta.sub_types.find(s => s.key === p.sub_type);
    const box = el("div");
    box.setAttribute("aria-label", p.name || st.type_label);
    if (p.name) box.append(el("div", "ex-card-type", st.type_label));
    box.append(el("h3", "ex-card-name", p.name || st.type_label));
    const addr = [p.address, p.town].filter(Boolean).join(", ");
    if (addr) box.append(el("p", "ex-card-addr", addr));
    const dl = el("dl", "ex-card-details");
    dl.hidden = true;
    box.append(dl);

    if (!state.meta.details_split) {
      fillDetails(dl, p.details);
    } else {
      loadDetails()
        .then(all => { if (cardId === id) fillDetails(dl, all[id]); })
        .catch(() => { if (cardId === id) box.append(el("p", "ex-card-note", "Details could not be loaded.")); });
    }

    popup.remove();
    cardId = id;
    popup.setLngLat(f.geometry.coordinates).setDOMContent(box).addTo(map);
  }

  function closeCardIfHidden() {
    if (!cardId) return;
    const f = state.points.features.find(x => x.properties.id === cardId);
    if (f && state.hidden.has(f.properties.sub_type)) popup.remove();
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && cardId && !document.getElementById("ex-about").open) popup.remove();
  });

  // ── Scope: statewide or one area ─────────────────────
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const titleEl = document.getElementById("ex-scope-title");
  const kpiEl = document.getElementById("ex-kpis");
  const panelEl = document.getElementById("ex-panel");

  // Points outside the scope stay on the map, faded, so the area reads in context.
  function scopeExpression() {
    const sc = state.scope;
    if (sc.kind === "region" || sc.kind === "district") return ["==", ["get", sc.kind], sc.area.idx];
    if (sc.kind === "radius") return ["boolean", ["feature-state", "inside"], false];
    return true;
  }
  function applyScopeStyle() {
    const inside = scopeExpression();
    const fade = v => (inside === true ? v : ["case", inside, v, v * 0.18]);
    for (const id of ["ex-points", "ex-points-unstaffed"]) {
      map.setPaintProperty(id, "circle-opacity", fade(1));
      map.setPaintProperty(id, "circle-stroke-opacity", fade(1));
    }
  }

  const areaGeoms = {};
  function areaGeometry(kind) {
    const file = kind === "region" ? "regions.geojson" : "districts.geojson";
    return areaGeoms[kind] || (areaGeoms[kind] = getJson(DATA + file)
      .catch(err => { delete areaGeoms[kind]; throw err; }));
  }

  function setScope(scope) {
    state.scope = scope;
    const sc = scope;
    if (sc.kind === "region" || sc.kind === "district") state.inScope = f => f.properties[sc.kind] === sc.area.idx;
    else if (sc.kind === "radius") state.inScope = f => state.dist[f.id] <= sc.miles;
    else state.inScope = () => true;
    titleEl.textContent = sc.kind === "statewide" ? "Connecticut"
      : sc.kind === "radius" ? `Within ${sc.miles} ${sc.miles === 1 ? "mile" : "miles"} of ${sc.label}`
      : sc.area.name;
    panelEl.classList.toggle("radius", sc.kind === "radius");

    const outline = map.getSource("ex-area");
    outline.setData({ type: "FeatureCollection", features: [] });
    map.getSource("ex-radius").setData(sc.kind === "radius"
      ? { type: "FeatureCollection", features: [circlePolygon(sc.center, sc.miles)] }
      : { type: "FeatureCollection", features: [] });
    map.removeFeatureState({ source: "ex-points" });
    if (sc.kind === "radius") {
      for (const f of state.points.features) {
        if (state.dist[f.id] <= sc.miles) map.setFeatureState({ source: "ex-points", id: f.id }, { inside: true });
      }
      const b = circleBounds(sc.center, sc.miles);
      map.fitBounds(b, { padding: 30, duration: reducedMotion ? 0 : 600 });
    } else if (sc.kind === "region" || sc.kind === "district") {
      const [w, s, e, n] = sc.area.bbox;
      map.fitBounds([[w, s], [e, n]], { padding: 40, maxZoom: 13, duration: reducedMotion ? 0 : 600 });
      areaGeometry(sc.kind)
        .then(fc => {
          if (state.scope !== sc) return;
          outline.setData({ type: "FeatureCollection", features: [fc.features[sc.area.idx]] });
        })
        .catch(() => showMessage("The area outline could not be loaded. The numbers and points are still correct."));
    } else {
      map.fitBounds(CT_BOUNDS, { padding: 24, duration: reducedMotion ? 0 : 600 });
    }
    applyScopeStyle();
    updateLegend();
    renderKpis();
  }

  // ── Radius geometry (straight-line, haversine) ───────
  const EARTH_MI = 3958.8;
  const rad = d => (d * Math.PI) / 180;
  function milesBetween([lng1, lat1], [lng2, lat2]) {
    const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
    return 2 * EARTH_MI * Math.asin(Math.sqrt(a));
  }
  function destination([lng, lat], miles, bearingDeg) {
    const d = miles / EARTH_MI, b = rad(bearingDeg), p1 = rad(lat), l1 = rad(lng);
    const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(b));
    const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
    return [(l2 * 180) / Math.PI, (p2 * 180) / Math.PI];
  }
  function circlePolygon(center, miles) {
    const ring = [];
    for (let i = 0; i <= 96; i++) ring.push(destination(center, miles, (i * 360) / 96));
    return { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [ring] } };
  }
  function circleBounds(center, miles) {
    const [, n] = destination(center, miles, 0), [e] = destination(center, miles, 90);
    const [, s] = destination(center, miles, 180), [w] = destination(center, miles, 270);
    return [[w, s], [e, n]];
  }

  // ── KPI numbers ──────────────────────────────────────
  // Precomputed numbers from areas.json when nothing is hidden; otherwise
  // the same numbers recomputed from the points in scope minus hidden types.
  function computeKpis(features) {
    const by = Object.fromEntries(state.meta.sub_types.map(s => [s.key, 0]));
    let sum = 0, n = 0;
    for (const f of features) {
      by[f.properties.sub_type]++;
      const r = f.properties.students_per_staff;
      if (r != null) { sum += r; n++; }
    }
    return { by_sub_type: by, students_per_library_staff_mean: n ? Math.round((sum / n) * 10) / 10 : null, students_per_library_staff_n: n };
  }
  function currentKpis() {
    const sc = state.scope;
    if (!state.hidden.size && sc.kind !== "radius") {
      const id = sc.kind === "statewide" ? "statewide" : sc.area.id;
      return state.areas.find(a => a.id === id).kpis;
    }
    return computeKpis(state.points.features.filter(f => state.inScope(f) && !state.hidden.has(f.properties.sub_type)));
  }

  const SHORT = {
    "Little Free Library": "Little Free Libraries",
    "Read to Grow BFK Organization": "Books for Kids partners",
    "Read to Grow BFB Organization": "Books for Babies partners",
    "Read to Grow Bookmobile Stop": "Bookmobile stops",
  };

  function renderKpis() {
    if (!state.areas) return;
    const k = currentKpis();
    const by = k.by_sub_type;
    const off = keys => keys.every(key => state.hidden.has(key));
    const sum = keys => keys.reduce((t, key) => t + (state.hidden.has(key) ? 0 : by[key]), 0);
    const stateMean = state.areas.find(a => a.id === "statewide").kpis.students_per_library_staff_mean;
    const cards = [];

    const card = (cls, num, label, extra = "") =>
      `<div class="ex-kpi ${cls}">${num}<div class="ex-kpi-label">${label}</div>${extra}</div>`;
    const big = (keys, value) => off(keys)
      ? `<div class="ex-kpi-num off">Turned off on the map</div>`
      : `<div class="ex-kpi-num">${fmt(value)}</div>`;

    const WITH = "School With Library Staff";
    cards.push(card("", big([WITH], by[WITH]), "School libraries with library staff"));
    cards.push(card("alert", big([UNSTAFFED], by[UNSTAFFED]), "School libraries without library staff"));

    let ratio;
    if (off([WITH])) ratio = `<div class="ex-kpi-num off">Turned off on the map</div>`;
    else if (!k.students_per_library_staff_n) ratio = `<div class="ex-kpi-num msg">No schools with library staff in this area</div>`;
    else ratio = `<div class="ex-kpi-num">${fmt(Math.round(k.students_per_library_staff_mean))}</div>`;
    const compare = state.scope.kind !== "statewide" && k.students_per_library_staff_n && !off([WITH])
      ? `<div class="ex-kpi-sub">State average ${fmt(Math.round(stateMean))}</div>` : "";
    cards.push(card("wide", ratio, "Students per library staff, average across schools with library staff", compare));

    cards.push(card("", big(["Public Library"], by["Public Library"]), "Public libraries"));

    const LIC = ["Child Care Center", "Group Child Care Home"];
    const EX = ["Child Care Center Exempt", "Youth Camp Exempt"];
    const ccSplit = off([...LIC, ...EX]) ? ""
      : `<div class="ex-kpi-sub">${fmt(sum(LIC))} licensed · ${fmt(sum(EX))} exempt</div>`;
    cards.push(card("", big([...LIC, ...EX], sum([...LIC, ...EX])), "Childcare centers", ccSplit));

    const half = (key, label) => `<div>${big([key], by[key])}<div class="ex-kpi-label">${label}</div></div>`;
    cards.push(`<div class="ex-kpi wide ex-kpi-pair">${half("Bookstore", "Bookstores")}${half("Museum", "Museums")}</div>`);

    const NP = state.meta.sub_types.filter(st => st.category === "Nonprofit").map(st => st.key);
    const npSplit = off(NP) ? "" : `<ul class="ex-kpi-split">${NP.filter(key => !state.hidden.has(key))
      .map(key => `<li><b>${fmt(by[key])}</b> ${SHORT[key]}</li>`).join("")}</ul>`;
    cards.push(card("wide", big(NP, sum(NP)), "Nonprofit and community", npSplit));

    kpiEl.innerHTML = cards.join("");
    renderNearby();
  }

  // ── Area picker (ARIA combobox) ──────────────────────
  // The area in effect, including one remembered under an address search.
  function selectedArea() {
    const sc = state.scope;
    if (sc.area) return sc.area;
    return sc.kind === "radius" && sc.prev.area ? sc.prev.area : null;
  }

  function initAreaPicker() {
    const input = document.getElementById("ex-area-input");
    const list = document.getElementById("ex-area-list");
    const clear = document.getElementById("ex-area-clear");
    const groups = [
      { kind: "region", label: "Planning regions" },
      { kind: "district", label: "School districts" },
    ];
    const options = state.areas.filter(a => a.type !== "statewide");
    let shown = [];
    let active = -1;

    function render() {
      const q = input.value.trim().toLowerCase();
      const sel = selectedArea();
      const selectedId = sel && sel.id;
      // When the box shows the selected area's name, list everything.
      const showAll = !q || (sel && input.value === sel.name);
      shown = options.filter(a => showAll || a.name.toLowerCase().includes(q));
      list.innerHTML = "";
      if (!shown.length) {
        list.innerHTML = `<div class="ex-combo-empty" role="presentation">No planning region or school district matches</div>`;
      }
      for (const g of groups) {
        const opts = shown.filter(a => a.type === g.kind);
        if (!opts.length) continue;
        const grp = document.createElement("div");
        grp.setAttribute("role", "group");
        grp.setAttribute("aria-labelledby", `ex-area-grp-${g.kind}`);
        grp.innerHTML = `<div class="ex-combo-head" id="ex-area-grp-${g.kind}" role="presentation">${g.label}</div>`;
        for (const a of opts) {
          const o = document.createElement("div");
          o.className = "ex-combo-opt";
          o.id = `ex-area-opt-${shown.indexOf(a)}`;
          o.setAttribute("role", "option");
          o.setAttribute("aria-selected", String(a.id === selectedId));
          o.textContent = a.name;
          o.addEventListener("mousedown", e => e.preventDefault());
          o.addEventListener("click", () => choose(a));
          grp.appendChild(o);
        }
        list.appendChild(grp);
      }
      setActive(-1);
    }
    function open() {
      render();
      list.hidden = false;
      input.setAttribute("aria-expanded", "true");
    }
    function close() {
      list.hidden = true;
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
      active = -1;
    }
    function setActive(i) {
      list.querySelectorAll(".ex-combo-opt.active").forEach(o => o.classList.remove("active"));
      active = i;
      if (i < 0) { input.removeAttribute("aria-activedescendant"); return; }
      const o = document.getElementById(`ex-area-opt-${i}`);
      o.classList.add("active");
      o.scrollIntoView({ block: "nearest" });
      input.setAttribute("aria-activedescendant", o.id);
    }
    function choose(a) {
      input.value = a.name;
      clear.hidden = false;
      close();
      // Picking an area ends the address search.
      if (state.scope.kind === "radius") state.dropAddress();
      setScope({ kind: a.type, area: a });
    }
    function clearArea() {
      input.value = "";
      clear.hidden = true;
      close();
      if (state.scope.kind === "radius") state.scope.prev = { kind: "statewide" };
      else if (state.scope.kind === "region" || state.scope.kind === "district") setScope({ kind: "statewide" });
    }
    state.clearArea = clearArea;

    input.addEventListener("focus", () => { areaGeometry("district").catch(() => {}); });
    input.addEventListener("click", () => { if (list.hidden) open(); });
    input.addEventListener("input", open);
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (list.hidden) open();
        if (!shown.length) return;
        const next = e.key === "ArrowDown" ? Math.min(active + 1, shown.length - 1) : Math.max(active - 1, 0);
        setActive(next);
      } else if (e.key === "Enter") {
        if (list.hidden) return;
        e.preventDefault();
        const pick = active >= 0 ? shown[active] : (shown.length === 1 ? shown[0] : null);
        if (pick) choose(pick);
      } else if (e.key === "Escape" && !list.hidden) {
        e.stopPropagation();
        close();
      }
    });
    input.addEventListener("blur", () => {
      close();
      // Leave the box showing what is actually selected.
      if (!input.value.trim()) clearArea();
      else input.value = selectedArea() ? selectedArea().name : "";
      clear.hidden = !selectedArea();
    });
    clear.addEventListener("click", () => { clearArea(); input.focus(); });

    document.getElementById("ex-reset").addEventListener("click", () => {
      state.clearAddress();
      clearArea();
      state.hidden.clear();
      applyVisibility();
    });

    renderKpis();
  }
  // ── Nearby list (radius mode) ────────────────────────
  const NEARBY_MAX = 50;
  const nearbyEl = document.getElementById("ex-nearby");
  const nearbyList = document.getElementById("ex-nearby-list");
  const nearbyEmpty = document.getElementById("ex-nearby-empty");

  function renderNearby() {
    const sc = state.scope;
    nearbyList.replaceChildren();
    if (sc.kind !== "radius") {
      nearbyEl.hidden = true;
      nearbyEmpty.hidden = false;
      nearbyEmpty.textContent = "Enter an address to list the places nearby.";
      return;
    }
    nearbyEl.hidden = false;
    const rows = state.points.features
      .filter(f => state.dist[f.id] <= sc.miles && !state.hidden.has(f.properties.sub_type))
      .sort((a, b) => state.dist[a.id] - state.dist[b.id]);
    const unit = sc.miles === 1 ? "mile" : "miles";
    nearbyEmpty.hidden = rows.length > 0;
    nearbyEmpty.textContent = `No places within ${sc.miles} ${unit} of this address.`;
    for (const f of rows.slice(0, NEARBY_MAX)) {
      const p = f.properties;
      const st = state.meta.sub_types.find(x => x.key === p.sub_type);
      const li = el("li");
      const btn = el("button", "ex-near-row");
      btn.type = "button";
      btn.append(
        el("span", "ex-near-name", p.name || st.type_label),
        el("span", "ex-near-type", p.name ? st.type_label : (p.town || "")),
        el("span", "ex-near-dist", `${state.dist[f.id].toFixed(1)} mi`),
      );
      btn.addEventListener("click", () => {
        if (window.matchMedia("(max-width: 767px)").matches && window.__exploreSheet) window.__exploreSheet(false);
        map.flyTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 15), duration: reducedMotion ? 0 : 800 });
        openCard(p.id);
      });
      li.append(btn);
      nearbyList.append(li);
    }
    if (rows.length > NEARBY_MAX) {
      nearbyList.append(el("li", "ex-near-more", `and ${fmt(rows.length - NEARBY_MAX)} more within ${sc.miles} ${unit}`));
    }
  }

  // ── Address search and radius ────────────────────────
  // Same flow and messages as the storymap's Your Neighborhood search:
  // debounced autocomplete through /api/geocode, Connecticut only.
  const CT_BBOX = { w: -73.7277, s: 40.9509, e: -71.7869, n: 42.0506 };
  const inCT = (lng, lat) => lng >= CT_BBOX.w && lng <= CT_BBOX.e && lat >= CT_BBOX.s && lat <= CT_BBOX.n;
  let marker = null;
  state.miles = 2;

  // "150 Main Street, Deep River, Connecticut 06417, United States" -> "150 Main Street, Deep River"
  function shortLabel(f) {
    const parts = (f.full_address || f.name || "").split(", ")
      .filter(x => x && x !== "United States" && !/^Connecticut\b/.test(x));
    return parts.slice(0, 2).join(", ") || f.name || "this address";
  }

  function setAddress({ label, lat, lng }) {
    const center = [lng, lat];
    state.dist = state.points.features.map(f => milesBetween(center, f.geometry.coordinates));
    const prev = state.scope.kind === "radius" ? state.scope.prev : state.scope;
    if (!marker) {
      marker = new maplibregl.Marker({ color: "#1E3A6F" });
      marker.getElement().setAttribute("aria-label", "Address");
    }
    marker.setLngLat(center).addTo(map);
    setScope({ kind: "radius", center, label, miles: state.miles, prev });
  }
  // Leaves radius mode without restoring the previous scope (the caller sets one).
  function dropAddress() {
    if (marker) marker.remove();
    state.dist = null;
    addrInput.value = "";
    addrClear.hidden = true;
    setStatus("");
  }
  function clearAddress() {
    if (state.scope.kind !== "radius") { dropAddress(); return; }
    const prev = state.scope.prev;
    dropAddress();
    setScope(prev);
  }
  state.dropAddress = dropAddress;
  state.clearAddress = clearAddress;

  const addrInput = document.getElementById("ex-addr-input");
  const addrList = document.getElementById("ex-addr-list");
  const addrClear = document.getElementById("ex-addr-clear");
  const addrStatus = document.getElementById("ex-addr-status");
  function setStatus(msg, isError = false) {
    addrStatus.textContent = msg || "";
    addrStatus.classList.toggle("is-error", !!isError);
  }

  function initAddressSearch() {
    let suggestions = [];
    let activeIdx = -1;
    let lastQuery = "";
    let debounceT = null;
    let lastReq = 0;

    function hideList() {
      addrList.hidden = true;
      addrList.replaceChildren();
      activeIdx = -1;
      addrInput.setAttribute("aria-expanded", "false");
      addrInput.removeAttribute("aria-activedescendant");
    }
    function renderList(items) {
      addrList.replaceChildren();
      if (!items.length) { hideList(); return; }
      items.forEach((f, i) => {
        const main = f.name || f.full_address || "";
        const sub = f.full_address && f.full_address !== main ? f.full_address : "";
        const o = el("div", "ex-addr-opt");
        o.id = `ex-addr-opt-${i}`;
        o.setAttribute("role", "option");
        o.setAttribute("aria-selected", "false");
        o.append(el("div", null, main));
        if (sub) o.append(el("div", "sub", sub));
        o.addEventListener("mousedown", e => { e.preventDefault(); pick(i); });
        addrList.append(o);
      });
      addrList.hidden = false;
      addrInput.setAttribute("aria-expanded", "true");
      activeIdx = -1;
    }
    function refreshActive() {
      addrList.querySelectorAll(".ex-addr-opt").forEach((o, i) => {
        const on = i === activeIdx;
        o.classList.toggle("active", on);
        o.setAttribute("aria-selected", String(on));
        if (on) { o.scrollIntoView({ block: "nearest" }); addrInput.setAttribute("aria-activedescendant", o.id); }
      });
    }
    async function fetchSuggestions(q) {
      const myReq = ++lastReq;
      try {
        const r = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
        if (myReq !== lastReq) return;
        if (!r.ok) {
          setStatus(r.status === 500 ? "Search is offline." : "Search error. Try again.", true);
          suggestions = [];
          hideList();
          return;
        }
        const data = await r.json();
        suggestions = (data.features || []).filter(f => f.coordinates && inCT(f.coordinates[0], f.coordinates[1]));
        if (!suggestions.length) {
          setStatus("No matches in Connecticut.", true);
          hideList();
        } else {
          setStatus("");
          renderList(suggestions);
        }
      } catch (e) {
        if (myReq === lastReq) setStatus("Network error.", true);
      }
    }
    function pick(i) {
      const f = suggestions[i];
      if (!f) return;
      const [lng, lat] = f.coordinates;
      if (!inCT(lng, lat)) { setStatus("That address is outside Connecticut.", true); return; }
      const displayName = f.name || f.full_address || "";
      addrInput.value = displayName;
      lastQuery = displayName;
      setStatus("");
      hideList();
      addrClear.hidden = false;
      setAddress({ label: shortLabel(f), lat, lng });
    }

    addrInput.addEventListener("input", () => {
      const q = addrInput.value.trim();
      if (q === lastQuery) return;
      lastQuery = q;
      clearTimeout(debounceT);
      if (q.length < 3) { hideList(); setStatus(""); return; }
      setStatus("Searching…");
      debounceT = setTimeout(() => fetchSuggestions(q), 240);
    });
    addrInput.addEventListener("focus", () => {
      if (suggestions.length && addrInput.value.trim().length >= 3 && state.scope.kind !== "radius") renderList(suggestions);
    });
    addrInput.addEventListener("blur", () => hideList());
    addrInput.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (!suggestions.length) return;
        if (addrList.hidden) renderList(suggestions);
        activeIdx = e.key === "ArrowDown" ? Math.min(activeIdx + 1, suggestions.length - 1) : Math.max(activeIdx - 1, 0);
        refreshActive();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (!addrList.hidden && suggestions.length) { pick(activeIdx >= 0 ? activeIdx : 0); return; }
        const q = addrInput.value.trim();
        if (q.length < 3) { setStatus("Enter at least three characters.", true); return; }
        clearTimeout(debounceT);
        fetchSuggestions(q).then(() => { if (suggestions.length) pick(0); });
      } else if (e.key === "Escape" && !addrList.hidden) {
        e.stopPropagation();
        hideList();
      }
    });
    addrClear.addEventListener("click", () => {
      suggestions = [];
      lastQuery = "";
      clearAddress();
      addrInput.focus();
    });

    // Radius chips: changing the distance never re-geocodes.
    document.querySelectorAll("[data-radius]").forEach(b => b.addEventListener("click", () => {
      state.miles = Number(b.dataset.radius);
      document.querySelectorAll("[data-radius]").forEach(o => {
        const on = o === b;
        o.classList.toggle("on", on);
        o.setAttribute("aria-pressed", String(on));
      });
      if (state.scope.kind === "radius") setScope({ ...state.scope, miles: state.miles });
    }));
  }
  // Test hook, like the storymap's window.__resolveAddress.
  window.__explore.setAddress = a => { addrInput.value = a.label; addrClear.hidden = false; setAddress(a); };

  window.__explore.setScope = s => setScope(s);


  // ── Load ─────────────────────────────────────────────
  const dataReady = Promise.all([
    getJson(DATA + "build_meta.json"),
    getJson(DATA + "access_points.geojson"),
    getJson("baii_data/ct_boundary.geojson"),
    getJson(DATA + "areas.json"),
  ]);
  const mapReady = new Promise(res => map.once("load", res));

  Promise.all([dataReady, mapReady])
    .then(([[meta, points, ct, areas]]) => {
      state.meta = meta;
      // Numeric ids let the radius fade points with feature state.
      points.features.forEach((f, i) => { f.id = i; });
      state.points = points;
      state.areas = areas.areas;
      buildLegend();
      addPointLayers(ct);
      initAreaPicker();
      initAddressSearch();
    })
    .catch(() => {
      showMessage("The map data could not be loaded. Check your connection and reload the page.");
    });
})();
</script>
</body>
</html>
